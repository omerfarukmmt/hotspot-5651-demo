services:
  postgres:
    image: postgres:16-alpine
    container_name: hotspot-postgres
    environment:
      POSTGRES_USER: hotspot
      POSTGRES_PASSWORD: hotspot_secret
      POSTGRES_DB: hotspot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotspot -d hotspot_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotspot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hotspot-backend
    environment:
      DATABASE_URL: postgresql://hotspot:hotspot_secret@postgres:5432/hotspot_db
      REDIS_URL: redis://redis:6379/0
      LOG_DIR: /app/logs
      SESSION_TTL_SECONDS: "7200"
      OTP_TTL_SECONDS: "180"
      DNSMASQ_LOG_FILE: /app/logs/dnsmasq_query.log
      # Gerçek hotspot kurulumunda dnsmasq lease dosyasına işaret eder (bkz. network/README.md);
      # boş kalırsa MAC adresi demo modunda IP'den türetilir.
      DNSMASQ_LEASES_FILE: ""
      # Gerçek Linux hotspot kutusunda true yapılır; backend'in NET_ADMIN + host network
      # gerektirir (bkz. network/README.md). Docker demo ortamında false kalmalı.
      ENABLE_NFTABLES: "false"
      ADMIN_API_KEY: "changeme-admin-key"
      # Rate limiting / OTP kilitleme (bkz. README.md "Güvenlik sertleştirmeleri").
      RATE_LIMIT_LOGIN_MAX: "10"
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: "300"
      RATE_LIMIT_SMS_REQUEST_MAX: "3"
      RATE_LIMIT_SMS_REQUEST_WINDOW_SECONDS: "600"
      OTP_MAX_ATTEMPTS: "5"
      OTP_LOCKOUT_SECONDS: "900"
      # Log rotasyonu: aktif log dosyası bu aralıkla imzalanıp archive/'a taşınır
      # ve dhcp_activity.chain.jsonl'e eklenir. Demoda kısa tutmak isterseniz
      # (ör. birkaç dakikada bir rotasyonu göstermek için) düşürebilirsiniz.
      LOG_ROTATE_INTERVAL_SECONDS: "86400"
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hotspot-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
