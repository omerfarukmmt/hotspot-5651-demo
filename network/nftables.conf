#!/usr/sbin/nft -f
# nftables ruleset — gerçek "gatekeeping" (varsayılan DROP, giriş yapanlar ACCEPT).
#
# Arayüz adları setup-ap.sh içindeki WAN_IF / LAN_IF değişkenleriyle uyumlu
# olmalı (varsayılan: wlan0 = telefon hotspot'una bağlı WAN, wlan1 = kendi AP'miz).
#
# Kapı bekçiliği IP bazlıdır (backend zaten oturumları IP ile eşliyor,
# bkz. backend/main.py _active_session_for_ip). Bir DHCP lease'i süresi dolup
# başka bir cihaza verilirse teorik olarak eski IP'nin izni miras kalabilir;
# bu demo kapsamında kabul edilebilir bir risktir (lease süresi = oturum TTL'i
# ile hizalanarak azaltılabilir).
#
# Backend, login/logout/expire anlarında bu set'e eleman ekler/siler:
#   nft add element inet hotspot allowed_clients { <ip> }
#   nft delete element inet hotspot allowed_clients { <ip> }
# (bkz. backend/nft_manager.py)

table inet hotspot {
    set allowed_clients {
        type ipv4_addr
        flags interval
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        # DHCP + DNS: giriş yapmamış istemciler bile IP alabilmeli ve
        # captive-portal auto-detect domain'lerini çözebilmeli (bkz. dnsmasq.conf.example).
        iifname "wlan1" udp dport { 67, 68 } accept
        iifname "wlan1" udp dport 53 accept
        iifname "wlan1" tcp dport 53 accept

        # Portal/nginx gateway'in kendisi (192.168.4.1) her zaman erişilebilir olmalı.
        iifname "wlan1" ip daddr 192.168.4.1 accept

        # Giriş yapmış istemciler: LAN -> WAN (gerçek internet)
        iifname "wlan1" oifname "wlan0" ip saddr @allowed_clients accept

        # Dönüş trafiği: WAN -> LAN
        iifname "wlan0" oifname "wlan1" ip daddr @allowed_clients accept
    }

    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "wlan0" masquerade
    }
}
