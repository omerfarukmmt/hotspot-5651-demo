worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Gercek hotspot modu: nginx container'i da network_mode: host ile calisir
    # (bkz. docker-compose.host.yml), bu yuzden backend'e "backend" DNS adiyla
    # degil 127.0.0.1 uzerinden ulasilir. nginx.conf (demo/bridge network) ile
    # tek farki bu satir.
    upstream hotspot_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        absolute_redirect off;

        # ------------------------------------------------------------------
        # Captive Portal statik dosyaları (index.html, status.html)
        # Doğrulanmamış kullanıcının erişebildiği TEK bölge burasıdır.
        # ------------------------------------------------------------------
        location /portal/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }

        location = /portal {
            return 302 /portal/index.html;
        }

        # ------------------------------------------------------------------
        # Backend API (giriş, OTP, oturum, log imzalama)
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://hotspot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ------------------------------------------------------------------
        # auth_request alt isteği: backend Redis'te geçerli oturum var mı bakar.
        # 200 -> internete izin ver, 401 -> captive portal'a yönlendir.
        # ------------------------------------------------------------------
        location = /auth-check {
            internal;
            proxy_pass http://hotspot_backend/api/v1/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ------------------------------------------------------------------
        # "İnternet" trafiği simülasyonu: diğer TÜM istekler önce oturum
        # kontrolünden geçer. Doğrulanmamış kullanıcı portala düşer.
        # ------------------------------------------------------------------
        location / {
            auth_request /auth-check;
            error_page 401 403 = @captive_portal;

            proxy_pass http://hotspot_backend/internet;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location @captive_portal {
            return 302 /portal/index.html;
        }
    }
}
